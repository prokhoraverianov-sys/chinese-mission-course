<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>Chinese Mission · Первый месяц</title>
  <link rel="stylesheet" href="./month-course.css">
</head>
<body>
  <a class="skip" href="#workspace">К занятию</a>
  <header class="masthead">
    <a class="brand" href="./index.html">CHINESE MISSION <span>中文</span></a>
    <nav aria-label="Разделы курса">
      <button id="map-button" type="button">Мой месяц</button>
      <button id="reviews-button" type="button">Повторение <span id="due-count"></span></button>
      <button id="progress-button" type="button">Результаты</button>
    </nav>
    <details class="settings"><summary>Мои данные</summary><div>
      <p>Прогресс хранится в этом браузере. Скачай копию для переноса.</p>
      <button id="export-button" type="button">Скачать прогресс</button>
      <label class="file-label">Загрузить копию<input id="import-file" type="file" accept="application/json,.json"></label>
    </div></details>
  </header>
  <p id="storage-status" class="storage-status" role="status" hidden></p>
  <main id="workspace" tabindex="-1"></main>
  <footer>4 недели · 3 занятия в неделю · без обязательного набора текста</footer>
  <noscript>Включи JavaScript, чтобы открыть задания курса.</noscript>
  <script type="module" src="./month-app.mjs"></script>
</body>
</html>
